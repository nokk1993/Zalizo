  </defs>
  <rect width="1024" height="1024" fill="url(#night)"/>
  <path d="M262 786 C 262 560, 470 640, 512 500 S 650 300, 762 262" fill="none" stroke="url(#trail)" stroke-width="96" stroke-linecap="round"/>
  <circle cx="262" cy="786" r="34" fill="#14100E" stroke="#FFB547" stroke-width="24"/>
  <circle cx="762" cy="262" r="86" fill="#FFFFFF"/>
